spring:
  application:
    name: portfolio-api

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fullstack_crew}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: crew-pool
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # The tables are owned by db/schema.sql. Hibernate must never alter them.
    hibernate.ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  sql:
    init:
      # Run db/schema.sql + db/seed.sql manually (see README). Booting does not
      # silently create or wipe anything.
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

crew:
  cors:
    # Comma-separated list of origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  jwt:
    # 256-bit secret, base64. Generate with:  openssl rand -base64 48
    # Must be supplied via env — the app refuses to start without it.
    secret: ${JWT_SECRET:}
    issuer: fullstack-crew-portfolio
    ttl-minutes: ${JWT_TTL_MINUTES:180}

  bootstrap-admin:
    # Only used when the admin_users table is completely empty. Both must be
    # set to create the first account; leave unset and create it by SQL instead.
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
